<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>股票分析 · A股博弈</title>
<meta name="theme-color" content="#FAF7F2"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="default"/>
<meta name="apple-mobile-web-app-title" content="股票分析"/>
<link rel="manifest" href="/manifest.webmanifest"/>
<link rel="icon" type="image/svg+xml" href="/icon.svg"/>
<link rel="apple-touch-icon" href="/apple-touch-icon.png"/>
<style>
:root {
  --bg:#FAF7F2; --bg2:#F1ECE3; --border:rgba(120,100,70,0.14);
  --text:#2C2A26; --muted:#6B6558; --accent:#A8734A; --rise:#B54848; --fall:#4A8060;
  --bubble-u:#EFE4D2; --bubble-a:#F1ECE3;
  --font-serif:"Songti SC","SimSun","Noto Serif SC",serif;
}
@media (prefers-color-scheme: dark) {
  :root { --bg:#1C1917; --bg2:#26201C; --border:rgba(190,160,120,0.15);
          --text:#E8DFCE; --muted:#A89878; --accent:#D4A76A;
          --bubble-u:#3A2F27; --bubble-a:#26201C; }
}
* { box-sizing: border-box; }
html, body { margin:0; padding:0; background:var(--bg); color:var(--text); font-family:var(--font-serif); }
body { display:flex; flex-direction:column; min-height:100vh; }
header {
  padding:10px 14px; border-bottom:1px solid var(--border); background:var(--bg);
  display:flex; align-items:center; justify-content:space-between; gap:10px;
}
header h1 { font-size:16px; font-weight:600; margin:0; }
nav a { color:var(--muted); font-size:13px; text-decoration:none; margin-left:12px; }
nav a:hover, nav a.active { color:var(--accent); }
select { background:var(--bg2); color:var(--text); border:1px solid var(--border); border-radius:6px; padding:4px 8px; font-size:12px; font-family:inherit; }
#quick-row { padding:8px 14px; display:flex; gap:8px; flex-wrap:wrap; border-bottom:1px solid var(--border); background:var(--bg); }
.quick-btn { padding:6px 12px; background:var(--bg2); border:1px solid var(--border); border-radius:16px; color:var(--text); font-size:12px; cursor:pointer; font-family:inherit; }
.quick-btn:hover { background:var(--accent); color:white; border-color:var(--accent); }
#feed { flex:1; overflow-y:auto; padding:16px 14px; display:flex; flex-direction:column; gap:14px; }
.msg { max-width:95%; }
.msg.user { align-self:flex-end; }
.msg .label { font-size:11px; color:var(--muted); margin-bottom:3px; }
.msg .bubble { padding:12px 14px; border-radius:10px; background:var(--bubble-a); border:1px solid var(--border); line-height:1.7; font-size:14px; }
.msg.user .bubble { background:var(--bubble-u); }
.msg.system .bubble { background:transparent; border:1px dashed var(--border); color:var(--muted); font-size:13px; }
.msg .bubble pre { background:rgba(0,0,0,0.06); padding:8px; border-radius:6px; overflow-x:auto; font-size:12px; }
.msg .bubble code { background:rgba(0,0,0,0.06); padding:1px 4px; border-radius:3px; font-size:12px; }
.msg .bubble table { border-collapse:collapse; width:100%; font-size:13px; }
.msg .bubble th, .msg .bubble td { border:1px solid var(--border); padding:4px 8px; text-align:left; }
.msg .bubble h1, .msg .bubble h2, .msg .bubble h3 { margin:10px 0 6px; }
footer { border-top:1px solid var(--border); padding:8px 14px; background:var(--bg); }
#input-row { display:flex; gap:8px; align-items:flex-end; }
#composer { flex:1; resize:none; border:1px solid var(--border); border-radius:6px; padding:8px 10px; background:var(--bg2); color:var(--text); font-family:inherit; font-size:14px; min-height:38px; max-height:150px; }
#send-btn { padding:10px 20px; background:var(--accent); color:white; border:none; border-radius:6px; font-size:14px; cursor:pointer; font-family:inherit; white-space:nowrap; }
#send-btn:disabled { background:var(--muted); cursor:wait; }

/* 工具确认弹窗 */
#tool-overlay { display:none; position:fixed; inset:0; background:rgba(30,20,10,0.55); z-index:9999; align-items:center; justify-content:center; padding:16px; }
#tool-overlay.show { display:flex; }
#tool-card { background:var(--bg); border-radius:12px; padding:22px; max-width:460px; width:100%; border-left:6px solid var(--accent); box-shadow:0 8px 28px rgba(0,0,0,0.3); }
#tool-card.warn { border-left-color:#D4A76A; background:#F3E6D4; color:#2C2A26; }
#tool-card.danger { border-left-color:#B54848; background:#F7E3DE; color:#2C2A26; }
#tool-card h3 { margin:0 0 12px; font-size:16px; }
#tool-card .row { margin:6px 0; font-size:13px; }
#tool-card code { background:rgba(0,0,0,0.08); padding:2px 6px; border-radius:4px; font-size:12px; }
.tool-note { margin-top:10px; padding:8px; background:rgba(181,72,72,0.1); color:#8B3939; border-radius:6px; font-size:12px; }
.tool-actions { display:flex; gap:10px; justify-content:flex-end; margin-top:16px; }
.tool-actions button { padding:8px 16px; border:none; border-radius:6px; font-family:inherit; font-size:13px; cursor:pointer; }
#tool-cancel { background:var(--bg2); color:var(--text); }
#tool-ok { background:#A8734A; color:white; }
#tool-card.danger #tool-ok { background:#B54848; }
#tool-ok:disabled { background:#999; cursor:not-allowed; }
</style>
</head>
<body>

<header>
  <h1>股票分析 · 对话</h1>
  <div style="display:flex;align-items:center;gap:10px;">
    <select id="model">
      <option value="DeepSeek" selected>DeepSeek V4 Pro（快，推荐）</option>
      <option value="arbiter">4 家仲裁（慢，1-2 分钟）</option>
      <option value="Gemini">Gemini</option>
      <option value="Claude">Claude</option>
      <option value="Codex">Codex</option>
    </select>
    <nav>
      <a href="/dashboard">仪表盘</a>
      <a href="/playbook">复盘</a>
      <a href="/interacted-stocks">交流过的股票</a>
      <a href="/audit">审计</a>
    </nav>
  </div>
</header>

<div id="quick-row">
  <button class="quick-btn" data-msg="我的持仓现在怎么样？">我的持仓</button>
  <button class="quick-btn" data-msg="今天有哪些重要推送？">近期推送</button>
  <button class="quick-btn" data-msg="14 点以后有什么需要关注的？">盘中要点</button>
  <button class="quick-btn" data-msg="最近有什么值得买入的机会？">荐股</button>
  <button class="quick-btn" data-msg="帮我用大白话解释一下当前市场氛围">市场氛围</button>
</div>

<div id="feed"></div>

<footer>
  <div id="input-row">
    <textarea id="composer" placeholder="输入问题，按 Enter 发送，Shift+Enter 换行" rows="1"></textarea>
    <button id="send-btn">发送</button>
  </div>
</footer>

<div id="tool-overlay">
  <div id="tool-card">
    <h3 id="tool-title">⚠️ 操作确认</h3>
    <div id="tool-body"></div>
    <div class="tool-actions">
      <button id="tool-cancel">取消</button>
      <button id="tool-ok">确认执行</button>
    </div>
  </div>
</div>

<script src="/vendor/tailwind.js"></script>
<script src="https://cdn.staticfile.org/marked/11.1.1/marked.min.js" onerror="console.warn('marked cdn fail')"></script>
<script src="https://cdn.staticfile.org/dompurify/3.1.6/purify.min.js" onerror="console.warn('dompurify cdn fail')"></script>
<script>
// =============== 核心逻辑（零依赖降级）===============
(function(){
  var feed = document.getElementById("feed");
  var composer = document.getElementById("composer");
  var sendBtn = document.getElementById("send-btn");
  var modelSel = document.getElementById("model");
  var sid = localStorage.getItem("chat_sid") || null;

  var modelMap = {
    arbiter: {mode:"consensus", model:null, name:"仲裁"},
    DeepSeek: {mode:"single", model:"deepseek-v4-pro", name:"DeepSeek V4 Pro"},
    Gemini: {mode:"single", model:"Gemini", name:"Gemini"},
    Claude: {mode:"single", model:"Claude", name:"Claude"},
    Codex: {mode:"single", model:"Codex", name:"Codex"},
  };

  function renderMd(text){
    // marked/DOMPurify 失败时降级为 <pre>
    if (typeof marked !== "undefined" && typeof DOMPurify !== "undefined") {
      try {
        return DOMPurify.sanitize(marked.parse(text || "", {breaks:true, gfm:true}));
      } catch(e){}
    }
    var esc = (text||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
    return "<pre>" + esc + "</pre>";
  }

  function append(role, text, label){
    var div = document.createElement("div");
    div.className = "msg " + role;
    var labelHtml = label ? '<div class="label">'+label+'</div>' : '';
    div.innerHTML = labelHtml + '<div class="bubble">' + renderMd(text) + '</div>';
    feed.appendChild(div);
    feed.scrollTop = feed.scrollHeight;
    return div;
  }

  function sendMessage(){
    var text = composer.value.trim();
    if (!text) return;
    var sel = modelSel.value;
    var meta = modelMap[sel] || modelMap.arbiter;

    append("user", text, null);
    composer.value = "";
    composer.style.height = "auto";

    var loading = append("system", "思考中…", meta.name);
    sendBtn.disabled = true;
    var tickStart = Date.now();
    var tickTimer = setInterval(function(){
      var s = Math.floor((Date.now()-tickStart)/1000);
      sendBtn.textContent = "思考中 " + s + "s";
      loading.querySelector(".bubble").textContent = "思考中… " + s + " 秒（4 家仲裁约 60-120s）";
    }, 1000);
    sendBtn.textContent = "思考中 0s";

    fetch("/api/chat/send", {
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body: JSON.stringify({
        session_id: sid,
        message: text,
        mode: meta.mode,
        model: meta.model,
      })
    }).then(function(r){
      if (!r.ok) return r.text().then(function(t){ throw new Error("HTTP "+r.status+" "+t.slice(0,200)); });
      return r.json();
    }).then(function(d){
      loading.remove();
      if (d.session_id){ sid = d.session_id; localStorage.setItem("chat_sid", sid); }
      (d.messages || []).forEach(function(m){
        if (m.role === "assistant") append("assistant", m.content, m.ai_name || "AI");
      });
      if (d.require_confirm) showToolConfirm(d.require_confirm);
    }).catch(function(e){
      loading.remove();
      append("system", "❌ 发送失败：" + e.message, "系统");
      console.error(e);
    }).finally(function(){
      clearInterval(tickTimer);
      sendBtn.disabled = false;
      sendBtn.textContent = "发送";
    });
  }

  function showToolConfirm(info){
    var overlay = document.getElementById("tool-overlay");
    var card = document.getElementById("tool-card");
    var title = document.getElementById("tool-title");
    var body = document.getElementById("tool-body");
    var okBtn = document.getElementById("tool-ok");
    var cancelBtn = document.getElementById("tool-cancel");

    var isDanger = info.level === "destructive";
    card.className = isDanger ? "danger" : "warn";
    title.textContent = isDanger ? "⛔ 破坏性操作 · 需要确认" : "⚠️ 写入操作 · 需要确认";
    body.innerHTML =
      '<div class="row"><b>工具:</b> <code>' + (info.tool_name||"") + '</code></div>' +
      '<div class="row"><b>说明:</b> ' + (info.description||"") + '</div>' +
      '<div class="row"><b>参数:</b> <code>' + JSON.stringify(info.args||{}) + '</code></div>' +
      (isDanger ? '<div class="tool-note">此操作将修改/删除数据，无法撤销。请 5 秒后再确认。</div>'
                : '<div class="tool-note">此操作会写入数据库。</div>');

    var remaining = isDanger ? 5 : 0;
    var timer = null;
    function updateBtn(){
      if (remaining > 0){
        okBtn.disabled = true;
        okBtn.textContent = "等待 " + remaining + "s…";
      } else {
        okBtn.disabled = false;
        okBtn.textContent = isDanger ? "我确定，执行" : "确认执行";
      }
    }
    updateBtn();
    if (isDanger){
      timer = setInterval(function(){
        remaining--;
        updateBtn();
        if (remaining <= 0) clearInterval(timer);
      }, 1000);
    }

    cancelBtn.onclick = function(){
      if (timer) clearInterval(timer);
      overlay.classList.remove("show");
      append("system", "已取消：" + info.tool_name, "系统");
    };

    okBtn.onclick = function(){
      if (okBtn.disabled) return;
      if (timer) clearInterval(timer);
      okBtn.disabled = true;
      okBtn.textContent = "执行中…";
      fetch("/api/chat/confirm", {
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body: JSON.stringify({session_id: sid, tool_name: info.tool_name, args: info.args || {}})
      }).then(function(r){ return r.json(); }).then(function(d){
        overlay.classList.remove("show");
        if (d.success) append("system", "✅ 已执行 " + info.tool_name + "：" + JSON.stringify(d.result), "系统");
        else append("system", "❌ 失败：" + (d.error || "未知"), "系统");
      }).catch(function(e){
        overlay.classList.remove("show");
        append("system", "❌ 请求失败：" + e.message, "系统");
      });
    };

    overlay.classList.add("show");
  }

  // === 事件绑定 ===
  sendBtn.addEventListener("click", sendMessage);
  composer.addEventListener("keydown", function(e){
    if (e.key === "Enter" && !e.shiftKey){
      e.preventDefault();
      sendMessage();
    }
  });
  composer.addEventListener("input", function(){
    composer.style.height = "auto";
    composer.style.height = Math.min(composer.scrollHeight, 150) + "px";
  });
  document.querySelectorAll(".quick-btn").forEach(function(btn){
    btn.addEventListener("click", function(){
      composer.value = btn.getAttribute("data-msg");
      sendMessage();
    });
  });

  // === 首屏：自动显示持仓 ===
  fetch("/api/positions?status=holding").then(function(r){ return r.json(); }).then(function(d){
    if (!d.items || !d.items.length){
      append("system", "当前无持仓。可以问我「近期荐股」或「市场氛围」。", "系统");
      return;
    }
    var rows = ["| 代码 | 名称 | 持股 |", "|---|---|---|"];
    d.items.forEach(function(p){
      rows.push("| " + p.stock_code + " | " + (p.stock_name||"") + " | " + (p.holding_qty||0) + " |");
    });
    append("system", "## 当前持仓\n\n" + rows.join("\n") + "\n\n问我任何问题，比如「今天重点看哪只？」", "系统");
  }).catch(function(e){ append("system", "持仓加载失败：" + e.message, "系统"); });

  // === Service Worker 注册（不阻塞）===
  if ("serviceWorker" in navigator){
    navigator.serviceWorker.register("/sw.js").catch(function(){});
  }

  console.log("chat.js ready, sid=" + sid);
})();
</script>
</body>
</html>
