<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>持仓变动</title>
<script src="/vendor/tailwind.js"></script>
<style>
  :root {
    --bg:#f7f8fa; --panel:#ffffff; --line:#d9dee7; --text:#20242c;
    --muted:#687080; --accent:#1f6feb; --buy:#b42318; --sell:#16803c;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#101216; --panel:#171a20; --line:#2b313b; --text:#e8ecf2; --muted:#98a2b3; --accent:#6aa4ff; --buy:#ff8a80; --sell:#79d68d; }
  }
  body { margin:0; background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif; }
  .wrap { max-width:1180px; margin:0 auto; padding:18px; }
  .panel { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:14px; }
  label { display:block; font-size:12px; color:var(--muted); margin-bottom:5px; }
  input, textarea, select { width:100%; background:var(--panel); color:var(--text); border:1px solid var(--line); border-radius:6px; padding:9px 10px; font-size:14px; outline:none; }
  textarea { min-height:96px; resize:vertical; }
  button { border:1px solid var(--line); border-radius:6px; padding:9px 12px; font-size:14px; cursor:pointer; background:var(--panel); color:var(--text); }
  button.primary { background:var(--accent); color:white; border-color:var(--accent); }
  button.active-buy { border-color:var(--buy); color:var(--buy); }
  button.active-sell { border-color:var(--sell); color:var(--sell); }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  th, td { border-bottom:1px solid var(--line); padding:9px 6px; text-align:left; vertical-align:top; }
  th { color:var(--muted); font-weight:500; }
  nav a { color:var(--muted); text-decoration:none; margin-left:14px; font-size:13px; }
  nav a.active, nav a:hover { color:var(--accent); }
  .muted { color:var(--muted); }
  .buy { color:var(--buy); }
  .sell { color:var(--sell); }
  .upload-box { border:1px dashed var(--line); border-radius:8px; padding:12px; background:rgba(127,127,127,.04); }
  .preview { max-height:220px; border:1px solid var(--line); border-radius:6px; object-fit:contain; background:#00000008; }
  .thumb { width:64px; height:64px; object-fit:cover; border-radius:6px; border:1px solid var(--line); }
</style>
</head>
<body>
<div class="wrap">
  <header class="flex items-center justify-between gap-3 mb-4">
    <div>
      <h1 class="text-xl font-semibold m-0">持仓变动</h1>
      <div class="text-xs muted" id="now"></div>
    </div>
    <nav>
      <a href="/chat">聊天</a>
      <a href="/holdings" class="active">持仓变动</a>
      <a href="/dashboard">仪表盘</a>
      <a href="/ai-pk">AI PK</a>
    </nav>
  </header>

  <section class="panel mb-4">
    <div class="grid grid-cols-2 md:grid-cols-8 gap-3 items-end">
      <div>
        <label>代码（可空）</label>
        <input id="stock_code" inputmode="numeric" maxlength="6" placeholder="不知道可不填"/>
      </div>
      <div>
        <label>名称</label>
        <input id="stock_name" placeholder="可只填股票名"/>
      </div>
      <div>
        <label>方向</label>
        <div class="grid grid-cols-2 gap-2">
          <button id="buyBtn" class="active-buy" type="button">买入</button>
          <button id="sellBtn" type="button">卖出</button>
        </div>
      </div>
      <div>
        <label>日期</label>
        <input id="trade_date" type="date"/>
      </div>
      <div>
        <label>价格</label>
        <input id="price" inputmode="decimal"/>
      </div>
      <div>
        <label>数量</label>
        <input id="quantity" inputmode="numeric"/>
      </div>
      <div>
        <label>费用</label>
        <input id="fee" inputmode="decimal" value="0"/>
      </div>
      <div>
        <button id="submitOne" class="primary w-full" type="button">提交</button>
      </div>
    </div>
    <div class="mt-3">
      <label>备注</label>
      <input id="note"/>
    </div>
    <div id="result" class="text-sm mt-3 muted"></div>
  </section>


  <section class="panel mb-4">
    <div class="flex items-center justify-between gap-3 mb-3">
      <div>
        <h2 class="text-base font-semibold m-0">图片上传</h2>
        <div class="text-xs muted">截图会先压缩再保存；不带代码也可以，在名称或说明里写股票名。</div>
      </div>
      <button id="uploadImageBtn" type="button" class="primary">上传图片</button>
    </div>
    <div class="grid grid-cols-1 lg:grid-cols-2 gap-4">
      <div class="upload-box">
        <label>选择图片</label>
        <input id="imageFile" type="file" accept="image/*"/>
        <div class="mt-3 hidden" id="imagePreviewWrap">
          <img id="imagePreview" class="preview w-full" alt="图片预览"/>
          <div class="text-xs muted mt-2" id="imageMeta"></div>
        </div>
        <div class="mt-3">
          <label>图片说明</label>
          <input id="imageNote" placeholder="例如：平安银行持仓截图 / 热股月采推荐截图"/>
        </div>
        <label class="flex items-center gap-2 mt-3 text-sm" style="display:flex;color:var(--text);">
          <input id="applyImageChange" type="checkbox" style="width:auto;"/>
          同时按上方表单登记为持仓变动
        </label>
        <div id="imageResult" class="text-sm mt-3 muted"></div>
      </div>
      <div>
        <div class="flex items-center justify-between mb-2">
          <h3 class="text-sm font-semibold m-0">最近图片</h3>
          <button id="reloadImages" type="button">刷新</button>
        </div>
        <div class="overflow-x-auto">
          <table>
            <thead><tr><th>图片</th><th>信息</th><th>状态</th></tr></thead>
            <tbody id="imagesBody"><tr><td colspan="3" class="muted">加载中</td></tr></tbody>
          </table>
        </div>
      </div>
    </div>
  </section>

  <div class="grid grid-cols-1 lg:grid-cols-2 gap-4 mb-4">
    <section class="panel">
      <div class="flex items-center justify-between mb-2">
        <h2 class="text-base font-semibold m-0">当前持仓</h2>
        <button id="reloadHoldings" type="button">刷新</button>
      </div>
      <div class="overflow-x-auto">
        <table>
          <thead><tr><th>股票</th><th>数量</th><th>成本</th><th>现价</th><th>浮动</th></tr></thead>
          <tbody id="holdingsBody"><tr><td colspan="5" class="muted">加载中</td></tr></tbody>
        </table>
      </div>
    </section>

    <section class="panel">
      <div class="flex items-center justify-between mb-2">
        <h2 class="text-base font-semibold m-0">最近提交</h2>
        <button id="reloadChanges" type="button">刷新</button>
      </div>
      <div class="overflow-x-auto">
        <table>
          <thead><tr><th>日期</th><th>股票</th><th>方向</th><th>成交</th><th>仓位</th></tr></thead>
          <tbody id="changesBody"><tr><td colspan="5" class="muted">加载中</td></tr></tbody>
        </table>
      </div>
    </section>
  </div>

  <section class="panel">
    <div class="flex items-center justify-between mb-2">
      <h2 class="text-base font-semibold m-0">批量提交</h2>
      <button id="submitBatch" type="button" class="primary">提交批量</button>
    </div>
    <textarea id="batchText" placeholder="600000 浦发银行 买入 2026-04-28 8.88 1000 1.2 备注"></textarea>
    <div id="batchResult" class="text-sm mt-3 muted"></div>
  </section>
</div>

<script>
let tradeType = "buy";
const today = new Date().toISOString().slice(0,10);
document.getElementById("now").textContent = new Date().toLocaleString("zh-CN");
document.getElementById("trade_date").value = today;

function setType(t) {
  tradeType = t;
  document.getElementById("buyBtn").className = t === "buy" ? "active-buy" : "";
  document.getElementById("sellBtn").className = t === "sell" ? "active-sell" : "";
}
document.getElementById("buyBtn").onclick = () => setType("buy");
document.getElementById("sellBtn").onclick = () => setType("sell");

function num(v) { const n = Number(v); return Number.isFinite(n) ? n : 0; }
function fmt(v, d=2) { return v == null ? "—" : Number(v).toFixed(d); }

async function postJSON(url, body) {
  const r = await fetch(url, {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(body)});
  const text = await r.text();
  let data;
  try { data = JSON.parse(text); } catch { data = {raw:text}; }
  if (!r.ok) throw new Error(data.detail || data.error || text);
  return data;
}



let selectedImagePayload = null;

function fileToImage(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => {
      const img = new Image();
      img.onload = () => resolve(img);
      img.onerror = reject;
      img.src = reader.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

async function compressImage(file) {
  const img = await fileToImage(file);
  const maxSide = 1600;
  let w = img.naturalWidth || img.width;
  let h = img.naturalHeight || img.height;
  const scale = Math.min(1, maxSide / Math.max(w, h));
  w = Math.max(1, Math.round(w * scale));
  h = Math.max(1, Math.round(h * scale));
  const canvas = document.createElement("canvas");
  canvas.width = w;
  canvas.height = h;
  const ctx = canvas.getContext("2d");
  ctx.fillStyle = "#fff";
  ctx.fillRect(0, 0, w, h);
  ctx.drawImage(img, 0, 0, w, h);
  let dataUrl = canvas.toDataURL("image/jpeg", 0.72);
  if (dataUrl.length > 2600000) dataUrl = canvas.toDataURL("image/jpeg", 0.58);
  return {
    filename: file.name || "holding.jpg",
    mime_type: "image/jpeg",
    image_base64: dataUrl.split(",")[1],
    preview: dataUrl,
    width: w,
    height: h,
    approxBytes: Math.round((dataUrl.length - dataUrl.indexOf(",") - 1) * 0.75)
  };
}

async function onImageSelected() {
  const file = document.getElementById("imageFile").files[0];
  const el = document.getElementById("imageResult");
  selectedImagePayload = null;
  if (!file) return;
  el.textContent = "压缩图片中";
  try {
    selectedImagePayload = await compressImage(file);
    document.getElementById("imagePreview").src = selectedImagePayload.preview;
    document.getElementById("imagePreviewWrap").classList.remove("hidden");
    document.getElementById("imageMeta").textContent = `${selectedImagePayload.width} x ${selectedImagePayload.height}，约 ${(selectedImagePayload.approxBytes/1024).toFixed(0)} KB`;
    el.textContent = "图片已准备好";
  } catch (e) {
    el.textContent = "图片处理失败：" + e.message;
  }
}

function currentFormChange(source) {
  return {
    stock_code: document.getElementById("stock_code").value,
    stock_name: document.getElementById("stock_name").value,
    trade_type: tradeType,
    trade_date: document.getElementById("trade_date").value || today,
    price: num(document.getElementById("price").value),
    quantity: Math.trunc(num(document.getElementById("quantity").value)),
    fee: num(document.getElementById("fee").value),
    note: document.getElementById("note").value,
    source
  };
}

async function uploadImage() {
  const el = document.getElementById("imageResult");
  if (!selectedImagePayload) { el.textContent = "请先选择图片"; return; }
  const apply = document.getElementById("applyImageChange").checked;
  const body = {
    filename: selectedImagePayload.filename,
    mime_type: selectedImagePayload.mime_type,
    image_base64: selectedImagePayload.image_base64,
    width: selectedImagePayload.width,
    height: selectedImagePayload.height,
    stock_code: document.getElementById("stock_code").value,
    stock_name: document.getElementById("stock_name").value,
    note: document.getElementById("imageNote").value || document.getElementById("note").value,
    apply_change: apply,
    change: apply ? currentFormChange("holding_image") : {}
  };
  el.textContent = "上传中";
  try {
    const d = await postJSON("/api/holding-changes/image", body);
    if (d.status === "applied") {
      el.textContent = "图片已保存，并已同步登记持仓变动";
    } else if (d.status === "saved_with_apply_error") {
      el.textContent = "图片已保存，但登记持仓失败：" + (d.error_msg || "");
    } else if (d.status === "saved_pending_code") {
      el.textContent = "图片已保存，但还需要补充股票名称或代码后再登记";
    } else {
      const tag = d.stock_code ? `，已识别 ${d.stock_code} ${d.stock_name || ""}` : "";
      el.textContent = "图片已保存，等待后续确认" + tag;
    }
    await Promise.all([loadImages(), loadHoldings(), loadChanges()]);
  } catch (e) {
    el.textContent = "上传失败：" + e.message;
  }
}

async function loadImages() {
  const r = await fetch("/api/holding-changes/images?limit=20");
  const d = await r.json();
  const rows = d.items || [];
  document.getElementById("imagesBody").innerHTML = rows.length ? rows.map(x => {
    const action = x.trade_type === "buy" ? "买入" : (x.trade_type === "sell" ? "卖出" : "待确认");
    const info = `${x.stock_code || ""} ${x.stock_name || ""}<br>${x.trade_date || ""} ${action} ${x.quantity || ""} ${x.price ? "@ " + fmt(x.price) : ""}<br><span class="muted">${x.note || ""}</span>`;
    return `<tr>
      <td><a href="${x.image_url}" target="_blank"><img class="thumb" src="${x.image_url}" alt="上传图片"/></a></td>
      <td>${info}</td>
      <td>${x.status || ""}${x.error_msg ? "<br><span class='sell'>" + x.error_msg + "</span>" : ""}</td>
    </tr>`;
  }).join("") : `<tr><td colspan="3" class="muted">暂无图片</td></tr>`;
}

async function submitOne() {
  const body = {
    stock_code: document.getElementById("stock_code").value,
    stock_name: document.getElementById("stock_name").value,
    trade_type: tradeType,
    trade_date: document.getElementById("trade_date").value || today,
    price: num(document.getElementById("price").value),
    quantity: Math.trunc(num(document.getElementById("quantity").value)),
    fee: num(document.getElementById("fee").value),
    note: document.getElementById("note").value,
    source: "holdings_page"
  };
  const el = document.getElementById("result");
  el.textContent = "提交中";
  try {
    const d = await postJSON("/api/holding-changes/submit", body);
    el.textContent = `已提交：${d.stock_code} ${d.stock_name || ""}，仓位 ${d.before_qty} -> ${d.after_qty}`;
    await Promise.all([loadHoldings(), loadChanges()]);
  } catch (e) {
    el.textContent = "失败：" + e.message;
  }
}

function parseBatchLine(line) {
  const parts = line.trim().split(/\s+/);
  if (parts.length < 6) return null;
  const [code, name, action, date, price, quantity, fee, ...note] = parts;
  return {stock_code:code, stock_name:name, trade_type:action, trade_date:date, price:Number(price), quantity:Number(quantity), fee:Number(fee || 0), note:note.join(" "), source:"holdings_batch"};
}

async function submitBatch() {
  const changes = document.getElementById("batchText").value.split(/\n+/).map(parseBatchLine).filter(Boolean);
  const el = document.getElementById("batchResult");
  if (!changes.length) { el.textContent = "没有可提交的行"; return; }
  el.textContent = "提交中";
  try {
    const d = await postJSON("/api/holding-changes/batch", {changes});
    el.textContent = `已处理：成功 ${d.applied} 条，失败 ${d.failed} 条`;
    await Promise.all([loadHoldings(), loadChanges()]);
  } catch (e) {
    el.textContent = "失败：" + e.message;
  }
}

async function loadHoldings() {
  const r = await fetch("/api/holding-changes/holdings");
  const d = await r.json();
  const rows = d.items || [];
  document.getElementById("holdingsBody").innerHTML = rows.length ? rows.map(p => {
    const ret = p.floating_return_pct;
    const cls = ret == null ? "" : (ret >= 0 ? "buy" : "sell");
    return `<tr>
      <td>${p.stock_code} ${p.stock_name || ""}</td>
      <td>${p.holding_qty}</td>
      <td>${fmt(p.avg_cost)}</td>
      <td>${fmt(p.latest_close)}</td>
      <td class="${cls}">${ret == null ? "—" : (ret >= 0 ? "+" : "") + fmt(ret) + "%"}</td>
    </tr>`;
  }).join("") : `<tr><td colspan="5" class="muted">暂无持仓</td></tr>`;
}

async function loadChanges() {
  const r = await fetch("/api/holding-changes/recent?limit=30");
  const d = await r.json();
  const rows = d.items || [];
  document.getElementById("changesBody").innerHTML = rows.length ? rows.map(x => {
    const isBuy = x.trade_type === "buy";
    return `<tr>
      <td>${x.trade_date}</td>
      <td>${x.stock_code} ${x.stock_name || ""}</td>
      <td class="${isBuy ? "buy" : "sell"}">${isBuy ? "买入" : "卖出"}</td>
      <td>${x.quantity} @ ${fmt(x.price)}</td>
      <td>${x.before_qty} -> ${x.after_qty}</td>
    </tr>`;
  }).join("") : `<tr><td colspan="5" class="muted">暂无提交</td></tr>`;
}

document.getElementById("submitOne").onclick = submitOne;
document.getElementById("imageFile").onchange = onImageSelected;
document.getElementById("uploadImageBtn").onclick = uploadImage;
document.getElementById("reloadImages").onclick = loadImages;
document.getElementById("submitBatch").onclick = submitBatch;
document.getElementById("reloadHoldings").onclick = loadHoldings;
document.getElementById("reloadChanges").onclick = loadChanges;
loadHoldings();
loadChanges();
loadImages();
</script>
</body>
</html>
